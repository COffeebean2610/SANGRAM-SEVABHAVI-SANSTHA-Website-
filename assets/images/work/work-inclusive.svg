<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="incGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2E22"/>
      <stop offset="100%" stop-color="#1E4D3B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#incGrad)"/>
  <circle cx="300" cy="170" r="95" fill="#FFFFFF" opacity="0.08"/>
  <g transform="translate(300, 170)">
    <!-- Handshake & Corporate Social Responsibility Symbol -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Ascending Steps / Growth bars -->
    <rect x="-60" y="20" width="22" height="35" fill="#FBF9F5" rx="3"/>
    <rect x="-30" y="0" width="22" height="55" fill="#FBF9F5" rx="3"/>
    <rect x="0" y="-20" width="22" height="75" fill="#FBF9F5" rx="3"/>
    <rect x="30" y="-45" width="22" height="100" fill="#D4AF37" rx="3"/>
    <!-- Ascending Star -->
    <polygon points="41,-65 44,-55 54,-55 46,-49 49,-39 41,-45 33,-39 36,-49 28,-55 38,-55" fill="#C86D3B"/>
  </g>
  <text x="300" y="320" font-family="'DM Serif Display', serif" font-size="24" fill="#FFFFFF" text-anchor="middle">
    05. CSR & Inclusive Growth
  </text>
  <text x="300" y="350" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" fill="#D4AF37" text-anchor="middle">
    CSR व सामाजिक भागीदारीतून शाश्वत विकास
  </text>
</svg>
