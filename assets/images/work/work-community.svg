<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#235442"/>
      <stop offset="100%" stop-color="#12372A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#commGrad)"/>
  <circle cx="300" cy="170" r="95" fill="#FFFFFF" opacity="0.08"/>
  <g transform="translate(300, 170)">
    <!-- Rural Village & Community Houses -->
    <path d="M-80 50 L-40 -10 L0 50 Z" fill="#C86D3B"/>
    <path d="M-70 50 L-70 20 L-10 20 L-10 50 Z" fill="#D4AF37"/>
    <rect x="-50" y="30" width="20" height="20" fill="#12372A"/>

    <path d="M-10 50 L35 -30 L80 50 Z" fill="#D4AF37"/>
    <path d="M5 50 L5 10 L65 10 L65 50 Z" fill="#FFFFFF"/>
    <rect x="25" y="25" width="20" height="25" fill="#12372A"/>

    <!-- Sprouting Leaf -->
    <path d="M0 -35 Q-25 -75 0 -95 Q25 -75 0 -35 Z" fill="#4CAF50"/>
    <path d="M0 -35 L0 -85" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="300" y="320" font-family="'DM Serif Display', serif" font-size="24" fill="#FFFFFF" text-anchor="middle">
    03. Community Upliftment
  </text>
  <text x="300" y="350" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" fill="#D4AF37" text-anchor="middle">
    ग्रामीण समुदाय विकास व शाश्वत सक्षमीकरण
  </text>
</svg>
