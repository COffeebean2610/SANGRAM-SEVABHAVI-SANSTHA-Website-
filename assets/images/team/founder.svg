<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="founderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#EFE9DC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="550" fill="url(#founderBg)"/>
  <rect x="15" y="15" width="470" height="520" fill="none" stroke="#D4AF37" stroke-width="2"/>
  
  <g transform="translate(250, 220)">
    <!-- Memorial / Visionary Garland & Profile Icon -->
    <circle cx="0" cy="0" r="110" fill="#12372A"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Dignified Silhouette / Memorial Emblem -->
    <circle cx="0" cy="-30" r="42" fill="#D4AF37"/>
    <path d="M-65 70 Q0 10 65 70 L55 85 Q0 30 -55 85 Z" fill="#D4AF37"/>
    <!-- Garland Motif -->
    <path d="M-80 50 Q0 110 80 50" fill="none" stroke="#C86D3B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="80" r="8" fill="#C86D3B"/>
  </g>

  <!-- Name and Role -->
  <text x="250" y="380" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#C86D3B" text-anchor="middle" font-weight="700" letter-spacing="1">
    FOUNDER
  </text>
  <text x="250" y="415" font-family="'Noto Serif Devanagari', Georgia, serif" font-size="22" fill="#12372A" text-anchor="middle" font-weight="700">
    Late Pralhad Baburao Palve (तात्या)
  </text>
  <text x="250" y="450" font-family="'Inter', sans-serif" font-size="14" fill="#728078" text-anchor="middle">
    Founding Visionary (19 June 1995)
  </text>
</svg>
