<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12372A"/>
      <stop offset="50%" stop-color="#1A4A39"/>
      <stop offset="100%" stop-color="#092017"/>
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C86D3B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="960" fill="url(#heroBg)"/>

  <!-- Sun / Dawn of Hope -->
  <circle cx="400" cy="380" r="180" fill="url(#warmSun)" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="400" cy="380" r="140" fill="url(#warmSun)" opacity="0.6"/>

  <!-- Geometric Architectural & Natural Layers -->
  <path d="M0 960 L0 680 Q200 640 400 680 T800 680 L800 960 Z" fill="#0C251C" opacity="0.95"/>
  <path d="M0 960 L0 740 Q250 710 500 750 T800 730 L800 960 Z" fill="#061610"/>

  <!-- Stylized Tree of Growth & Nurturing -->
  <g transform="translate(400, 480)">
    <!-- Tree Trunk -->
    <path d="M-12 180 Q-2 80 -18 0 Q-30 -60 0 -130 Q30 -60 18 0 Q2 80 12 180 Z" fill="#C86D3B"/>
    <!-- Foliage Layers -->
    <circle cx="0" cy="-140" r="90" fill="#2E7D32" opacity="0.85"/>
    <circle cx="-60" cy="-110" r="70" fill="#388E3C" opacity="0.8"/>
    <circle cx="60" cy="-110" r="70" fill="#1B5E20" opacity="0.85"/>
    <circle cx="0" cy="-180" r="60" fill="#4CAF50" opacity="0.75"/>
  </g>

  <!-- Figures representing Children & Community holding hands -->
  <g transform="translate(400, 640)" fill="#FBF9F5">
    <!-- Center Child with Book -->
    <circle cx="0" cy="-60" r="22"/>
    <path d="M-22 -30 Q0 -40 22 -30 L28 40 L-28 40 Z" opacity="0.95"/>
    <!-- Book -->
    <path d="M-18 -15 Q0 -25 18 -15 L16 8 Q0 -2 -16 8 Z" fill="#D4AF37"/>

    <!-- Left Child / Person -->
    <circle cx="-70" cy="-45" r="18"/>
    <path d="M-86 -20 Q-70 -28 -54 -20 L-50 45 L-90 45 Z" opacity="0.9"/>

    <!-- Right Child / Person -->
    <circle cx="70" cy="-45" r="18"/>
    <path d="M54 -20 Q70 -28 86 -20 L90 45 L50 45 Z" opacity="0.9"/>
  </g>

  <!-- Rays of Knowledge -->
  <line x1="400" y1="200" x2="400" y2="120" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
  <line x1="260" y1="260" x2="200" y2="200" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
  <line x1="540" y1="260" x2="600" y2="200" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Institutional Typography within Artwork -->
  <text x="400" y="840" font-family="'DM Serif Display', Georgia, serif" font-size="28" fill="#FBF9F5" text-anchor="middle" letter-spacing="1">
    SANGRAM SEVABHAVI SANSTHA
  </text>
  <text x="400" y="875" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" fill="#D4AF37" text-anchor="middle" font-weight="600">
    वंचितांच्या विकासासाठी समर्पित सेवाभावी कार्य
  </text>
  <text x="400" y="905" font-family="'Inter', sans-serif" font-size="14" fill="#B4C4BC" text-anchor="middle" letter-spacing="2">
    ESTABLISHED 1995 • PIMPALNER, MAHARASHTRA
  </text>
</svg>
